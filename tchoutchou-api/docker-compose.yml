services:
  db:
    image: postgres:17-alpine
    container_name: tchoutchou-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tchoutchou

    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: tchoutchou-api
    profiles:
      - prod
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/tchoutchou
    depends_on:
      db:
        condition: service_healthy

  api-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: tchoutchou-api-dev
    profiles:
      - dev
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/tchoutchou
      - NODE_ENV=development
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate dev --name init || true && npm run start:dev:poll"
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma

volumes:
  pgdata: